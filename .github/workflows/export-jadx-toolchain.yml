name: Export JADX Toolchain

on:
  push:
    paths:
      - ".github/workflows/export-jadx-toolchain.yml"
      - "scripts/install_jadx.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lab
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install and verify JADX 1.5.6
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/install_jadx.sh "$RUNNER_TEMP/jadx"
          "$RUNNER_TEMP/jadx/bin/jadx" --version
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/jadx-1.5.6-linux.tar.gz" jadx
          sha256sum "$RUNNER_TEMP/jadx-1.5.6-linux.tar.gz" > "$RUNNER_TEMP/jadx-1.5.6-linux.tar.gz.sha256"
      - name: Upload JADX toolchain
        uses: actions/upload-artifact@v4
        with:
          name: jadx-1.5.6-linux-toolchain
          path: |
            ${{ runner.temp }}/jadx-1.5.6-linux.tar.gz
            ${{ runner.temp }}/jadx-1.5.6-linux.tar.gz.sha256
          retention-days: 7
          compression-level: 0
