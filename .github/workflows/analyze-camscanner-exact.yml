name: Analyze Exact CamScanner Reference

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/analyze-camscanner-exact.yml"
      - "scripts/**"

permissions:
  contents: write

jobs:
  analyze-camscanner:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      REF_NAME: CamScanner
      REF_VERSION: 7.23.5.2608050000
      REF_VERSION_CODE: 72351
      REF_PACKAGE: com.intsig.camscanner
      USER_APKM_SHA256: 2f62abc367c8e34c6234bde6108c5b317aec027e132237a8673cf43c11cb0a52
      USER_BASE_SHA256: 801514f2226f4cf35ee1992260b456c221847d8f8a212c4d0e06d17b1b31f973
      USER_BASE_MD5: 9ac9500c7d7062a2a501d05fe0434dd7
      REF_SLUG: camscanner-7.23.5.2608050000

    steps:
      - name: Checkout lab
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install JADX 1.5.6
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/install_jadx.sh "$RUNNER_TEMP/jadx"
          "$RUNNER_TEMP/jadx/bin/jadx" --version | tee jadx-version.txt

      - name: Download version-pinned CamScanner XAPK from APKPure
        shell: bash
        run: |
          set -euo pipefail
          XAPK="$RUNNER_TEMP/camscanner-reference.xapk"
          URL="https://d.apkpure.com/b/XAPK/${REF_PACKAGE}?versionCode=${REF_VERSION_CODE}&nc=arm64-v8a&sv=21"
          echo "Downloading public version-pinned XAPK: $REF_PACKAGE code $REF_VERSION_CODE"
          curl --fail --location --retry 4 --retry-delay 3 \
            -A "Mozilla/5.0" \
            "$URL" -o "$XAPK"
          test -s "$XAPK"
          ls -lh "$XAPK"
          file "$XAPK"
          echo "xapk_sha256=$(sha256sum "$XAPK" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Extract and verify byte-identical base APK
        shell: bash
        run: |
          set -euo pipefail
          XAPK="$RUNNER_TEMP/camscanner-reference.xapk"
          OUT="$RUNNER_TEMP/camscanner-xapk"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          unzip -q "$XAPK" -d "$OUT"

          echo "APK files in XAPK:"
          find "$OUT" -type f -iname '*.apk' -printf '%s %p\n' | sort -nr

          MATCH=""
          while IFS= read -r -d '' apk; do
            SHA=$(sha256sum "$apk" | awk '{print $1}')
            MD5=$(md5sum "$apk" | awk '{print $1}')
            echo "candidate=$(basename "$apk") sha256=$SHA md5=$MD5"
            if [[ "$SHA" == "$USER_BASE_SHA256" && "$MD5" == "$USER_BASE_MD5" ]]; then
              MATCH="$apk"
              break
            fi
          done < <(find "$OUT" -type f -iname '*.apk' -print0)

          if [[ -z "$MATCH" ]]; then
            echo "No APK in the downloaded XAPK is byte-identical to the user-supplied base.apk." >&2
            echo "Expected SHA-256: $USER_BASE_SHA256" >&2
            echo "Expected MD5: $USER_BASE_MD5" >&2
            exit 1
          fi

          cp "$MATCH" "$RUNNER_TEMP/camscanner-exact-base.apk"
          echo "Verified byte-identical executable base APK: $MATCH"
          sha256sum "$RUNNER_TEMP/camscanner-exact-base.apk"
          md5sum "$RUNNER_TEMP/camscanner-exact-base.apk"

      - name: Preserve verified reference XAPK and exact base as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: camscanner-verified-input-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/camscanner-reference.xapk
            ${{ runner.temp }}/camscanner-exact-base.apk
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

      - name: Decompile exact base APK with JADX
        shell: bash
        run: |
          set -u
          rm -rf work/camscanner-jadx "reports/$REF_SLUG"
          mkdir -p work/camscanner-jadx "reports/$REF_SLUG"
          set +e
          "$RUNNER_TEMP/jadx/bin/jadx" \
            --deobf \
            --show-bad-code \
            --call-graph json \
            -d work/camscanner-jadx \
            "$RUNNER_TEMP/camscanner-exact-base.apk" \
            2>&1 | tee "reports/$REF_SLUG/JADX_LOG.txt"
          JADX_RC=${PIPESTATUS[0]}
          set -e
          echo "$JADX_RC" > "reports/$REF_SLUG/JADX_EXIT_CODE.txt"
          ERR_COUNT=$(grep -oE 'finished with errors, count: [0-9]+' "reports/$REF_SLUG/JADX_LOG.txt" | tail -1 | grep -oE '[0-9]+' || true)
          echo "${ERR_COUNT:-0}" > "reports/$REF_SLUG/JADX_ERROR_COUNT.txt"
          echo "JADX exit code: $JADX_RC; reported errors: ${ERR_COUNT:-0}"
          test -d work/camscanner-jadx/sources || test -d work/camscanner-jadx/resources

      - name: Generate architecture reports
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/analyze_architecture.py \
            --jadx-output work/camscanner-jadx \
            --input-file "$RUNNER_TEMP/camscanner-exact-base.apk" \
            --reports "reports/$REF_SLUG"
          {
            echo "reference=$REF_NAME"
            echo "package=$REF_PACKAGE"
            echo "version=$REF_VERSION"
            echo "version_code=$REF_VERSION_CODE"
            echo "user_supplied_apkm_sha256=$USER_APKM_SHA256"
            echo "user_supplied_base_sha256=$USER_BASE_SHA256"
            echo "user_supplied_base_md5=$USER_BASE_MD5"
            echo "downloaded_xapk_sha256=$xapk_sha256"
            echo "analyzed_base_sha256=$(sha256sum "$RUNNER_TEMP/camscanner-exact-base.apk" | awk '{print $1}')"
            echo "analyzed_base_md5=$(md5sum "$RUNNER_TEMP/camscanner-exact-base.apk" | awk '{print $1}')"
            echo "base_byte_identical_to_user_upload=true"
            echo "jadx_version=$($RUNNER_TEMP/jadx/bin/jadx --version)"
            echo "generated_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "usage=clean-room feature and architecture analysis; do not copy proprietary source/assets"
          } > "reports/$REF_SLUG/REFERENCE_PROVENANCE.txt"

      - name: Add native-engine inventory from downloaded XAPK
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/camscanner-xapk"
          {
            echo "# Native Engine Inventory"
            echo
            echo "Native libraries present in the version-pinned public XAPK whose base APK was verified byte-identical to the user upload."
            echo
            for apk in "$OUT"/**/*.apk "$OUT"/*.apk; do
              [[ -f "$apk" ]] || continue
              unzip -Z1 "$apk" 2>/dev/null | grep -E '^lib/.+\.so$' || true
            done | sort -u | sed 's/^/- `/' | sed 's/$/`/'
          } > "reports/$REF_SLUG/NATIVE_ENGINE_INVENTORY.md"

      - name: Upload complete JADX output
        uses: actions/upload-artifact@v4
        with:
          name: camscanner-jadx-${{ github.run_id }}
          path: work/camscanner-jadx/
          retention-days: 14
          if-no-files-found: error
          compression-level: 6

      - name: Upload architecture reports
        uses: actions/upload-artifact@v4
        with:
          name: camscanner-reports-${{ github.run_id }}
          path: reports/${{ env.REF_SLUG }}/
          retention-days: 30
          if-no-files-found: error

      - name: Commit structured reports to lab
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add "reports/$REF_SLUG"
          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi
          git commit -m "Analyze byte-identical CamScanner $REF_VERSION base with JADX"
          git push origin HEAD:main
